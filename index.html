    .skyline{
      position:fixed;bottom:0;left:0;right:0;z-index:1;
      height:200px;
      pointer-events:none;
    }

    .cloud{
      position:fixed;
      background:rgba(255,255,255,0.08);
      border-radius:50px;
      pointer-events:none;
      z-index:1;
      animation:cloud-drift linear infinite;
    }
    @keyframes cloud-drift{
      from{transform:translateX(-200px);}
      to{transform:translateX(calc(100vw + 200px));}
    }

    .stars{
      position:fixed;inset:0;z-index:1;pointer-events:none;
    }
    .star{
      position:absolute;
      border-radius:50%;
      background:#fff;
      animation:star-twinkle ease-in-out infinite;
    }
    @keyframes star-twinkle{
      0%,100%{opacity:0.2;}
      50%{opacity:1;}
    }

    .page{
      position:relative;z-index:10;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
    }

    .welcome{
      text-align:center;
      margin-bottom:28px;
      animation:welcome-in .5s ease both;
    }
    @keyframes welcome-in{
      from{opacity:0;transform:translateY(-12px);}
      to{opacity:1;transform:translateY(0);}
    }
    .welcome-time{
      font-size:13px;font-weight:600;
      color:rgba(255,255,255,0.55);
      letter-spacing:2px;text-transform:uppercase;
      margin-bottom:8px;
    }
    .welcome-msg{
      font-size:clamp(24px,3vw,36px);
      font-weight:300;
      color:#000; /* Changed to black */
      letter-spacing:-0.5px;
    }
    .welcome-msg strong{font-weight:700;}

    .card{
      width:420px;max-width:95vw;
      background:rgba(255,255,255,0.97);
      box-shadow:0 24px 80px rgba(0,0,0,0.35),0 4px 16px rgba(0,0,0,0.2);
      animation:card-in .6s cubic-bezier(.22,1,.36,1) .1s both;
      overflow:hidden;
    }
    @keyframes card-in{
      from{opacity:0;transform:translateY(28px) scale(.97);}
      to{opacity:1;transform:translateY(0) scale(1);}
    }

    .card-stripe{
      height:4px;
      background:linear-gradient(90deg,
        var(--ms-red) 25%,var(--ms-green) 25% 50%,
        var(--ms-cyan) 50% 75%,var(--ms-yellow) 75%);
    }

    .card-body{padding:40px 44px 32px;}
    .ms-logo{margin-bottom:24px;}

    .step{display:none;}
    .step.active{display:block;}

    h1{font-size:22px;font-weight:600;color:var(--text-primary);margin-bottom:18px;letter-spacing:-0.2px;}

    .lock-notice{
      display:flex;align-items:center;gap:8px;
      font-size:12.5px;color:var(--text-secondary);margin-bottom:18px;
    }

    .field{margin-bottom:14px;}

    input[type="email"],input[type="password"],input[type="text"]{
      width:100%;height:36px;border:1px solid var(--border);
      padding:0 12px;font-size:14px;font-family:var(--font);
      color:var(--text-primary);background:#faf9f8;outline:none;
      border-radius:0;transition:border-color .12s,box-shadow .12s,background .12s;
    }
    input:focus{border-color:var(--ms-blue);background:#fff;box-shadow:inset 0 0 0 1px var(--ms-blue);}
    input.error-field{border-color:var(--error);box-shadow:inset 0 0 0 1px var(--error);}

    .error-msg{display:none;align-items:center;gap:5px;color:var(--error);font-size:12px;margin-top:4px;}
    .error-msg.show{display:flex;}

    .btn-primary{
      width:100%;height:40px;background:var(--ms-blue);color:#fff;
      border:none;font-size:14px;font-weight:600;font-family:var(--font);
      cursor:pointer;border-radius:0;transition:background .12s;
      display:flex;align-items:center;justify-content:center;
    }
    .btn-primary:hover{background:var(--ms-blue-hover);}
    .btn-primary:active{background:var(--ms-blue-dark);}

    .spinner{
      display:none;width:16px;height:16px;
      border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
      border-radius:50%;animation:spin .6s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg);}}
    .btn-primary.loading .btn-text{display:none;}
    .btn-primary.loading .spinner{display:block;}

    .back-user{
      display:flex;align-items:center;gap:8px;background:#f3f2f1;
      border:none;padding:8px 12px;cursor:pointer;font-size:14px;
      color:var(--text-primary);font-family:var(--font);margin-bottom:20px;
      width:auto;transition:background .12s;
    }
    .back-user:hover{background:#edebe9;}
    .back-user .chevron{margin-left:auto;color:var(--text-secondary);}

    .card-footer{
      padding:14px 44px;border-top:1px solid #f3f2f1;
      background:#faf9f8;display:flex;gap:16px;
    }
    .card-footer span{font-size:12px;color:var(--ms-blue);}

    .fail-icon{
      width:52px;height:52px;background:#fde7e9;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:24px;margin-bottom:16px;
    }
    .subtitle{font-size:13.5px;color:var(--text-secondary);line-height:1.6;}
    .progress-track{height:4px;background:#edebe9;overflow:hidden;margin-top:22px;}
    .progress-bar{height:100%;background:var(--ms-blue);width:0%;transition:width 2.5s linear;}

    .page-footer{
      margin-top:20px;display:flex;gap:14px;align-items:center;
      animation:welcome-in .5s ease .3s both;
    }
    .page-footer span{font-size:11.5px;color:rgba(255,255,255,0.4);}
    .page-footer .sep{color:rgba(255,255,255,0.2);}
</style>
</head>
